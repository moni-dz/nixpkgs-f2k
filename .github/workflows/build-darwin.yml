name: "build (darwin)"

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '10 2 * * *'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        runtime: [osx-arm64]
        include:
          - runtime: osx-arm64
            os: macos-latest
    steps:
    - uses: actions/checkout@v7
    - uses: DeterminateSystems/nix-installer-action@v23
    - uses: cachix/cachix-action@v17
      with:
        name: fortuneteller2k
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: nix build -L .#emacs-plus-git
