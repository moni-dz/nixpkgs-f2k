name: "build (x86-64-linux)"

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '10 2 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: DeterminateSystems/nix-installer-action@v23
    - uses: cachix/cachix-action@v17
      with:
        name: fortuneteller2k
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: nix build -L --keep-going .#awesome-git .#awesome-composite-git .#awesome-luajit-git .#picom-git .#picom-ft-labs-git .#mpv-discord .#mpv-discord-script
